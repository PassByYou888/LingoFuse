[package]
name = "lingofuse"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Rust binding for the LingoFuse distributed RPC framework"
license = "MIT"
repository = "https://github.com/PassByYou888/LingoFuse"
keywords = ["rpc", "ipc", "distributed", "lingofuse", "ffi"]
categories = ["api-bindings", "network-programming"]
readme = "README.md"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "lingofuse"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1